[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "SIM", "RUF"]
ignore = [
    "B008",    # Depends(...) in parameter defaults is the FastAPI idiom
    "B904",    # exception chaining handled deliberately at API boundary
    "UP042",   # (str, Enum) mixins are deliberate: JSON/DB interop
    "RUF002",  # unicode arrows/diagrams in docstrings are intentional
    "RUF003",  # unicode arrows/diagrams in comments are intentional
    "E402",    # conftest must set env before importing the app
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
